<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Meteo e foliage · Giappone 2026</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;background:transparent;color:CanvasText;--muted:color-mix(in srgb,CanvasText 60%,transparent);--line:color-mix(in srgb,CanvasText 17%,transparent);--subtle:color-mix(in srgb,CanvasText 6%,transparent);--gold:#b99436;--orange:#cd8650;--red:#be6556}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;min-width:200px}
main{display:flex;flex-direction:column;gap:9px;margin:0 auto;padding:5px 3px 12px;max-width:520px}
.city{border:1px solid var(--line);border-radius:12px;background:transparent;padding:12px 12px 10px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:9px}
.place{display:flex;align-items:baseline;gap:7px;min-width:0}
.name{font-size:16px;font-weight:710;letter-spacing:-.035em;line-height:1.1}
.kanji{font-size:11px;color:var(--muted)}
.visit{font-size:10px;font-weight:650;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.nowrow{display:flex;align-items:center;gap:7px;margin:10px 0 8px;min-height:30px}
.icon{font-size:21px;line-height:1;width:24px;text-align:center}
.temp{font-size:26px;line-height:1;font-weight:680;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.desc{font-size:10px;color:var(--muted);line-height:1.45;flex:1;min-width:0}
.desc b{font-size:9px;display:block;font-weight:600;letter-spacing:.065em;text-transform:uppercase}
.now-extra{font-size:10px;line-height:1.35;text-align:right;color:var(--muted);white-space:nowrap}
.trip{display:grid;grid-template-columns:1fr auto;gap:4px 9px;align-items:center;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tripline{font-size:11px;font-weight:650;line-height:1.35}
.tripline small{font-size:10px;color:var(--muted);font-weight:500;display:block}
.triptemps{font-size:14px;letter-spacing:-.03em;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.triptemps .low{color:#568ebc}.triptemps .high{color:var(--orange)}
.historic{font-size:10px;color:var(--muted);line-height:1.3}
.historic-num{font-size:11px;color:var(--muted);font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fol-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:9px;margin-bottom:5px}
.fol-title{font-size:10px;font-weight:700;letter-spacing:.012em}.trend{font-size:9px;font-weight:500;color:var(--muted);margin-left:5px;white-space:nowrap}
.fol-head a{font-size:9px;color:var(--muted);text-decoration:none;text-underline-offset:2px}
.fol-head a:hover{text-decoration:underline}
.folrow{display:grid;grid-template-columns:51px 1fr 75px 47px;align-items:center;gap:6px;min-width:0;min-height:19px}
.kind{font-size:10px;color:var(--muted);font-weight:620;display:inline-flex;align-items:center;gap:5px}
.kind-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.kind-dot.yellow{background:var(--gold)}.kind-dot.orange{background:var(--orange)}.kind-dot.red{background:var(--red)}
.ranges{display:flex;gap:3px;min-width:0;align-items:center}
.seg{height:5px;flex:1;border-radius:8px;background:var(--line);opacity:.66}
.ranges.yellow .seg.on{background:var(--gold);opacity:1}.ranges.orange .seg.on{background:var(--orange);opacity:1}.ranges.red .seg.on{background:var(--red);opacity:1}
.phase{font-size:10px;color:var(--muted);white-space:nowrap;text-align:right}
.date{font-size:9px;color:var(--muted);text-align:right;white-space:nowrap}
.note{font-size:9px;line-height:1.4;color:var(--muted);margin:6px 0 0}
.status-unknown{font-size:10px;color:var(--muted)}
@media(max-width:330px){.city{padding:11px 9px 9px}.folrow{grid-template-columns:48px 1fr 61px 40px;gap:4px}.date{font-size:9px}.phase{font-size:9px}.name{font-size:15px}.kanji{display:none}.now-extra{font-size:9px}.desc{font-size:9px}}
@media(prefers-reduced-motion:no-preference){.city{transition:border-color .2s}.city:hover{border-color:color-mix(in srgb,CanvasText 30%,transparent)}}
</style>
</head>
<body>
<main id="cards" aria-label="Meteo e foliage delle sei tappe in Giappone"></main>
<script>
'use strict';
// Bollettino JMC del 1 ottobre 2026; dati spot Weathernews rilevati il 22 ottobre 2026.
// Ginkgo e aceri: date di colorazione di alberi campione, NON di un'intera città.
// La fase arancione è una convenzione visiva interpolata, non una previsione indipendente.
const FOLIAGE_UPDATED='2026-10-01';
const CITIES=[
 {id:'osaka',name:'Osaka',jp:'大阪',lat:34.6937,lon:135.5023,start:'2026-11-13',end:'2026-11-15',yellow:'2026-11-24',red:'2026-12-04',avgY:'2026-11-22',avgR:'2026-12-01'},
 {id:'kyoto',name:'Kyoto',jp:'京都',lat:35.0116,lon:135.7681,start:'2026-11-15',end:'2026-11-19',yellow:'2026-11-27',red:'2026-12-11',avgY:'2026-11-24',avgR:'2026-12-05'},
 {id:'takayama',name:'Takayama',jp:'高山',lat:36.1461,lon:137.2516,start:'2026-11-19',end:'2026-11-22',spot:'Santuario Hie',spotPeak:'2026-11-05',spotFallen:'2026-11-13',spotUrl:'https://weathernews.jp/koyo/spot/25235/'},
 {id:'kanazawa',name:'Kanazawa',jp:'金沢',lat:36.5613,lon:136.6562,start:'2026-11-22',end:'2026-11-25',yellow:'2026-11-10',red:'2026-11-30',avgY:'2026-11-10',avgR:'2026-11-24'},
 {id:'nikko',name:'Nikkō',jp:'日光',lat:36.756,lon:139.599,start:'2026-11-27',end:'2026-11-27',spot:'Area templi',spotPeak:'2026-11-12',spotFallen:'2026-11-25',spotUrl:'https://weathernews.jp/koyo/spot/24107/'},
 {id:'tokyo',name:'Tokyo',jp:'東京',lat:35.6762,lon:139.6503,start:'2026-11-25',end:'2026-11-30',yellow:'2026-11-26',red:'2026-11-28',avgY:'2026-11-23',avgR:'2026-11-28'}
];
const JMC='https://n-kishou.com/corp/news-contents/autumn/?lang=en';
const root=document.getElementById('cards');
const demo=new URLSearchParams(location.search).has('demo');
const dayMs=86400000;
const toNum=s=>Date.parse(s+'T12:00:00Z');
const days=(a,b)=>Math.round((toNum(a)-toNum(b))/dayMs);
const betweenDates=(start,end)=>{const out=[];for(let x=toNum(start);x<=toNum(end);x+=dayMs)out.push(new Date(x).toISOString().slice(0,10));return out};
const monthDay=d=>d.slice(8,10)+'/'+d.slice(5,7);
const labelDay=d=>new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const fmt=n=>Number.isFinite(n)?Math.round(n)+'°':'—';
const delta=(a,b)=>Math.round((toNum(a)-toNum(b))/dayMs);
const nowJP=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).slice(0,10);
const nowClock=()=>new Intl.DateTimeFormat('it-IT',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date());
const wxIcon=code=>code==null?'·':code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code<=48?'🌫️':code<=57?'🌦️':code<=67?'🌧️':code<=77?'❄️':code<=82?'🌦️':code<=86?'🌨️':code>=95?'⛈️':'☁️';
const wxText=code=>code==null?'Dati non disponibili':code===0?'Sereno':code<=2?'Poco nuvoloso':code===3?'Nuvoloso':code<=48?'Nebbia':code<=57?'Pioviggine':code<=67?'Pioggia':code<=77?'Neve':code<=82?'Rovesci':code<=86?'Neve':code>=95?'Temporale':'Variabile';
let forecasts=[], history=[];
function dateMid(c){const d=betweenDates(c.start,c.end);return d[Math.floor((d.length-1)/2)];}
function stage(date,target,fallen){if(!target)return {id:-1,text:'Non disponibile'};if(fallen&&date>=fallen)return {id:2,text:'Oltre picco'};const diff=days(date,target);return diff < -4?{id:0,text:'In anticipo'}:diff<=4?{id:1,text:'Al picco'}:{id:2,text:'In calo'};}
function orangeDate(c){if(!c.yellow||!c.red)return null;return new Date(Math.round((toNum(c.yellow)+toNum(c.red))/2)).toISOString().slice(0,10)}
function foliageRow(color,name,date,mid,fallen,avg,derived=false){const st=stage(mid,date,fallen);const title=derived?'Transizione cromatica indicativa, ricavata come punto medio tra le due previsioni JMC. Non è un bollettino autonomo.':date?'Data da bollettino foliage 2026':'Nessun dato specifico per questo colore nella zona';
 
 return `<div class="folrow" title="${title}"><span class="kind"><i class="kind-dot ${color}"></i>${name}</span><span class="ranges ${color}" aria-label="${name}: ${st.text}">${[0,1,2].map(i=>`<i class="seg ${i===st.id?'on':''}"></i>`).join('')}</span><span class="phase">${st.text}</span><span class="date">${date?labelDay(date):'—'}${derived?'*':''}</span></div>`;
}
function foliageHtml(c){const mid=dateMid(c);const src=c.spotUrl||JMC;const trend=c.avgR&&c.red?days(c.red,c.avgR):null;const delay=trend==null?'':trend>0?`<span class="trend" title="Data degli aceri prevista ${trend} giorni dopo la media">Ritardo +${trend}g</span>`:trend<0?`<span class="trend" title="Data degli aceri prevista ${-trend} giorni prima della media">Anticipo ${-trend}g</span>`:`<span class="trend">In media</span>`;const title=c.spot?`Foliage · ${c.spot}`:`Foliage 2026 ${delay}`;let lines='';
 if(c.spot){lines=foliageRow('yellow','Giallo',null,mid)+foliageRow('orange','Arancio',null,mid)+foliageRow('red','Rosso',c.spotPeak,mid,c.spotFallen)+`<div class="note">${c.spot}: possibile caduta foglie da ${labelDay(c.spotFallen)}.</div>`;}
 else{lines=foliageRow('yellow','Giallo',c.yellow,mid,null,c.avgY)+foliageRow('orange','Arancio',orangeDate(c),mid,null,null,true)+foliageRow('red','Rosso',c.red,mid,null,c.avgR)}
 return `<div class="fol-head"><span class="fol-title">${title}</span><a href="${src}" target="_blank" rel="noopener noreferrer" title="Bollettino aggiornato al ${FOLIAGE_UPDATED}">Fonte ↗</a></div>${lines}`;
}
function historicAverages(c,h){const dates=betweenDates(c.start,c.end).map(d=>'2025'+d.slice(4));const idx=(h?.daily?.time||[]).map((v,i)=>dates.includes(v)?i:-1).filter(i=>i!==-1);const hi=idx.map(i=>h.daily.temperature_2m_max[i]).filter(Number.isFinite);const lo=idx.map(i=>h.daily.temperature_2m_min[i]).filter(Number.isFinite);return {hi:hi.length?hi.reduce((a,b)=>a+b,0)/hi.length:null,lo:lo.length?lo.reduce((a,b)=>a+b,0)/lo.length:null};}
function tripAverages(c,w){const dates=betweenDates(c.start,c.end).filter(d=>d>=nowJP());const daily=w?.daily;if(!daily?.time)return {count:0,total:dates.length};const idx=daily.time.map((v,i)=>dates.includes(v)?i:-1).filter(i=>i!==-1);const hi=idx.map(i=>daily.temperature_2m_max[i]).filter(Number.isFinite),lo=idx.map(i=>daily.temperature_2m_min[i]).filter(Number.isFinite);return {count:Math.min(hi.length,lo.length),total:dates.length,hi:hi.length?hi.reduce((a,b)=>a+b,0)/hi.length:null,lo:lo.length?lo.reduce((a,b)=>a+b,0)/lo.length:null};}
function cityHtml(c,i){const w=forecasts[i],h=history[i];const temp=w?.current?.temperature_2m,weather=w?.current?.weather_code;const trip=tripAverages(c,w);const hist=historicAverages(c,h);const dateStr=c.start===c.end?labelDay(c.start):`${Number(c.start.slice(-2))}–${labelDay(c.end)}`;
 const tripLabel=demo?'Dati di anteprima (esempio)':trip.count?`Previsione 2026 · ${trip.count}/${trip.total} gg`:(nowJP()>c.end?'Viaggio trascorso':'Previsione 2026 non disponibile');
 const weatherDetail=demo?'DEMO · dati inventati':w?.current?`${wxText(weather)} · ${nowClock()} JST`:'Dati in caricamento / non disponibili';
 return `<article class="city" id="${c.id}"><div class="head"><span class="place"><span class="name">${c.name}</span><span class="kanji">${c.jp}</span></span><span class="visit">${dateStr}</span></div>
 <div class="nowrow"><span class="icon" aria-hidden="true">${wxIcon(weather)}</span><span class="temp">${fmt(temp)}</span><span class="desc"><b>Meteo attuale</b>${weatherDetail}</span>${w?.current?`<span class="now-extra">Percepita ${fmt(w.current.apparent_temperature)}<br>☂ ${w.current.relative_humidity_2m??'—'}% umid.</span>`:''}</div>
 <div class="trip"><div class="tripline">Durante il viaggio<small>${tripLabel}</small></div><div class="triptemps">${trip.count?`<span class="high">↑ ${fmt(trip.hi)}</span> <span class="low">↓ ${fmt(trip.lo)}</span>`:'—'}</div><div class="historic">2025 · media delle massime e minime nelle stesse date</div><div class="historic-num">${hist.hi==null?'—':`↑ ${fmt(hist.hi)}  ↓ ${fmt(hist.lo)}`}</div></div>
 ${foliageHtml(c)}</article>`;
}
function render(){root.innerHTML=CITIES.map(cityHtml).join('');}
async function getJson(url,timeout=15000){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeout);try{const res=await fetch(url,{signal:ctrl.signal,cache:'no-store'});if(!res.ok)throw Error(`${res.status}`);return await res.json()}finally{clearTimeout(t)}}
function apiUrl(endpoint,params){const u=new URL(endpoint);for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));return u.toString()}
async function load(){const loc={latitude:CITIES.map(c=>c.lat).join(','),longitude:CITIES.map(c=>c.lon).join(','),timezone:'Asia/Tokyo'};
 if(demo){forecasts=CITIES.map((c,i)=>({current:{temperature_2m:12+i,apparent_temperature:10+i,relative_humidity_2m:58,weather_code:[2,3,0,61,3,1][i]}}));render();return;}
 const fUrl=apiUrl('https://api.open-meteo.com/v1/forecast',{...loc,current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code',daily:'temperature_2m_max,temperature_2m_min',forecast_days:16});
 const hUrl=apiUrl('https://archive-api.open-meteo.com/v1/archive',{...loc,start_date:'2025-11-13',end_date:'2025-11-30',daily:'temperature_2m_max,temperature_2m_min'});
 const jobs=[getJson(fUrl).then(data=>{if(!Array.isArray(data)||data.length!==6)throw Error('Forecast locations');forecasts=data;render()}).catch(e=>console.warn('Meteo Open-Meteo:',e.message)),getJson(hUrl).then(data=>{if(!Array.isArray(data)||data.length!==6)throw Error('Archive locations');history=data;render()}).catch(e=>console.warn('Storico Open-Meteo:',e.message))];
 await Promise.all(jobs);
}
render();load();
// Aggiornamento meteo ogni 30 minuti mentre la pagina resta aperta.
if(!demo)setInterval(()=>{if(!document.hidden)load()},30*60*1000);
</script>
</body>
</html>
