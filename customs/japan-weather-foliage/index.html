<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Japan weather and foliage</title>
<style>
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light dark;
  background:transparent;
  color:CanvasText;
  --muted:color-mix(in srgb,CanvasText 62%, transparent);
  --line:color-mix(in srgb,CanvasText 16%, transparent);
  --subtle:color-mix(in srgb,CanvasText 6%, transparent);
  --ginkgo-1:#688125;
  --ginkgo-2:#a9b22e;
  --ginkgo-3:#d9b91d;
  --ginkgo-4:#c9863b;
  --maple-1:#688125;
  --maple-2:#d7a054;
  --maple-3:#e0462a;
  --maple-4:#a1302b;
  --fallen:#756a62;
}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;min-width:240px}
main{display:flex;flex-direction:column;gap:12px;margin:0 auto;padding:6px 4px 14px;max-width:560px}
.city{border:1px solid var(--line);border-radius:14px;background:transparent;padding:14px 14px 12px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.place{display:flex;align-items:center;gap:8px;min-width:0}
.name{font-size:20px;font-weight:750;letter-spacing:-.035em;line-height:1.05}
.kanji{font-size:13px;color:var(--muted)}
.visit{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2;text-align:right}
.nowrow{display:flex;align-items:center;gap:14px;margin:12px 0 10px;min-height:38px}
.icon{font-size:32px;line-height:1;width:32px;text-align:center;flex:0 0 32px}
.temp{font-size:42px;line-height:1;font-weight:730;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.desc{font-size:12px;color:var(--muted);flex:1;min-width:0;padding-top: 4px;}
.desc b{font-size:11px;display:block;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px}
.now-extra{display:flex;flex-direction:column;gap:3px;flex-shrink:0;font-size:11px;line-height:1.3;color:var(--muted);white-space:nowrap}
.now-extra .stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.now-extra .stat-label{text-align:left}
.now-extra .stat-value{text-align:right;font-variant-numeric:tabular-nums}
.history{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.history-title{font-size:13px;font-weight:700;line-height:1.35}
.history-title small{font-size:11px;color:var(--muted);font-weight:500;display:block}
.history-num{font-size:16px;letter-spacing:-.03em;font-weight:750;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.history-num .low{color:#5c92bd}.history-num .high{color:#c77b44}
.fol-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;margin-bottom:8px}
.fol-title{font-size:12px;font-weight:800;letter-spacing:.01em}
.fol-head a{font-size:10px;color:var(--muted);text-decoration:none;text-underline-offset:2px}
.fol-head a:hover{text-decoration:underline}
.folrow{display:grid;grid-template-columns:56px 1fr 46px;align-items:center;gap:8px;min-width:0;min-height:23px}
.folrow+.folrow{margin-top:6px}
.kind{font-size:12px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.kind-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.kind-dot.ginkgo{background:var(--ginkgo-3)}
.kind-dot.maple{background:var(--maple-3)}
.barwrap{position:relative;height:12px;display:flex;align-items:center}
.bar{position:relative;width:100%;height:10px;border-radius:999px;overflow:visible;border:1px solid color-mix(in srgb,CanvasText 8%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,CanvasText 3%, transparent)}
.bar.ginkgo{background:linear-gradient(90deg,var(--ginkgo-1) 0%,var(--ginkgo-2) 24%,var(--ginkgo-3) 52%,var(--ginkgo-4) 80%,var(--fallen) 100%)}
.bar.maple{background:linear-gradient(90deg,var(--maple-1) 0%,var(--maple-2) 24%,var(--maple-3) 50%,var(--maple-4) 76%,var(--fallen) 100%)}
.dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.18);box-shadow:0 0 10px rgba(255,255,255,.20);z-index:2}
.fol-date{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.status-unknown{font-size:12px;color:var(--muted)}
@media(max-width:340px){
  .city{padding:12px 11px 11px}
  .name{font-size:18px}
  .temp{font-size:42px}
  .visit,.history-title{font-size:11px}
  .history-num{font-size:15px}
  .folrow{grid-template-columns:52px 1fr 40px;gap:6px}
  .kanji{display:none}
}
@media(prefers-reduced-motion:no-preference){.city{transition:border-color .2s}.city:hover{border-color:color-mix(in srgb,CanvasText 28%, transparent)}}
</style>
</head>
<body>
<main id="cards" aria-label="Meteo e foliage delle sei tappe in Giappone"></main>
<script>
'use strict';
const FOLIAGE_UPDATED='2026-10-01';
const CITIES=[
 {id:'osaka',name:'Osaka',jp:'大阪',lat:34.6937,lon:135.5023,start:'2026-11-13',end:'2026-11-15',ginkgoPeak:'2026-11-24',maplePeak:'2026-12-04',ginkgoAvg:'2026-11-22',mapleAvg:'2026-12-01'},
 {id:'kyoto',name:'Kyoto',jp:'京都',lat:35.0116,lon:135.7681,start:'2026-11-15',end:'2026-11-19',ginkgoPeak:'2026-11-27',maplePeak:'2026-12-11',ginkgoAvg:'2026-11-24',mapleAvg:'2026-12-05'},
 {id:'takayama',name:'Takayama',jp:'高山',lat:36.1461,lon:137.2516,start:'2026-11-19',end:'2026-11-22',ginkgoPeak:'2026-10-30',maplePeak:'2026-11-05',mapleFallen:'2026-11-13',sourceLabel:'Santuario Hie',sourceUrl:'https://weathernews.jp/koyo/spot/25235/'},
 {id:'kanazawa',name:'Kanazawa',jp:'金沢',lat:36.5613,lon:136.6562,start:'2026-11-22',end:'2026-11-25',ginkgoPeak:'2026-11-10',maplePeak:'2026-11-30',ginkgoAvg:'2026-11-10',mapleAvg:'2026-11-24'},
 {id:'nikko',name:'Nikkō',jp:'日光',lat:36.756,lon:139.599,start:'2026-11-27',end:'2026-11-27',ginkgoPeak:'2026-11-05',maplePeak:'2026-11-12',mapleFallen:'2026-11-25',sourceLabel:'Area templi',sourceUrl:'https://weathernews.jp/koyo/spot/24107/'},
 {id:'tokyo',name:'Tokyo',jp:'東京',lat:35.6762,lon:139.6503,start:'2026-11-25',end:'2026-11-30',ginkgoPeak:'2026-11-26',maplePeak:'2026-11-28',ginkgoAvg:'2026-11-23',mapleAvg:'2026-11-28'}
];
const JMC='https://n-kishou.com/corp/news-contents/autumn/?lang=en';
const root=document.getElementById('cards');
const demo=new URLSearchParams(location.search).has('demo');
const dayMs=86400000;
const toNum=s=>Date.parse(s+'T12:00:00Z');
const fromNum=n=>new Date(n).toISOString().slice(0,10);
const addDays=(d,n)=>fromNum(toNum(d)+n*dayMs);
const betweenDates=(start,end)=>{const out=[];for(let x=toNum(start);x<=toNum(end);x+=dayMs)out.push(new Date(x).toISOString().slice(0,10));return out};
const labelDay=d=>new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const fmt=n=>Number.isFinite(n)?Math.round(n)+'°':'—';
const nowJP=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).slice(0,10);
const nowClock=()=>new Intl.DateTimeFormat('it-IT',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date());
const wxIcon=code=>code==null?'·':code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code<=48?'🌫️':code<=57?'🌦️':code<=67?'🌧️':code<=77?'❄️':code<=82?'🌦️':code<=86?'🌨️':code>=95?'⛈️':'☁️';
const wxText=code=>code==null?'Dati non disponibili':code===0?'Sereno':code<=2?'Poco nuvoloso':code===3?'Nuvoloso':code<=48?'Nebbia':code<=57?'Pioviggine':code<=67?'Pioggia':code<=77?'Neve':code<=82?'Rovesci':code<=86?'Neve':code>=95?'Temporale':'Variabile';
let forecasts=[], history=[];
function dateMid(c){const d=betweenDates(c.start,c.end);return d[Math.floor((d.length-1)/2)];}
function barModel(type,c){
  if(type==='ginkgo'){
    const peak=c.ginkgoPeak;
    const start=addDays(peak,-10);
    const end=c.ginkgoFallen||addDays(peak,10);
    return {peak,start,end,date:peak};
  }
  const peak=c.maplePeak;
  const start=addDays(peak,-12);
  const end=c.mapleFallen||addDays(peak,8);
  return {peak,start,end,date:peak};
}
function dotLeft(model,tripDate){
  const a=toNum(model.start), b=toNum(model.end), x=toNum(tripDate);
  const p=((x-a)/(b-a))*100;
  return Math.max(1,Math.min(99,p));
}
function foliageSource(c){return c.sourceUrl||JMC}
function foliageBar(type,c){
  const model=barModel(type,c);
  const left=dotLeft(model,dateMid(c));
  const name=type==='ginkgo'?'Ginkgo':'Acero';
  const cls=type;
  const peakLabel=labelDay(model.date);
  return `<div class="folrow"><span class="kind"><i class="kind-dot ${cls}"></i>${name}</span><div class="barwrap"><div class="bar ${cls}"><span class="dot" style="left:${left}%"></span></div></div><span class="fol-date">${peakLabel}</span></div>`;
}
function foliageHtml(c){
  const source=foliageSource(c);
  return `<div class="fol-head"><span class="fol-title">Foliage previsto</span><a href="${source}" target="_blank" rel="noopener noreferrer">Fonte ↗</a></div>${foliageBar('ginkgo',c)}${foliageBar('maple',c)}`;
}
function historicAverages(c,h){
  const dates=betweenDates(c.start,c.end).map(d=>'2025'+d.slice(4));
  const idx=(h?.daily?.time||[]).map((v,i)=>dates.includes(v)?i:-1).filter(i=>i!==-1);
  const hi=idx.map(i=>h.daily.temperature_2m_max[i]).filter(Number.isFinite);
  const lo=idx.map(i=>h.daily.temperature_2m_min[i]).filter(Number.isFinite);
  return {hi:hi.length?hi.reduce((a,b)=>a+b,0)/hi.length:null,lo:lo.length?lo.reduce((a,b)=>a+b,0)/lo.length:null};
}
function cityHtml(c,i){
  const w=forecasts[i], h=history[i];
  const temp=w?.current?.temperature_2m, weather=w?.current?.weather_code;
  const hist=historicAverages(c,h);
  const dateStr=c.start===c.end?labelDay(c.start):`${Number(c.start.slice(-2))} – ${labelDay(c.end)}`;
  const weatherDetail=demo?'DEMO · dati inventati':w?.current?`${wxText(weather)} · ${nowClock()} JST`:'Dati in caricamento / non disponibili';
  return `<article class="city" id="${c.id}"><div class="head"><span class="place"><span class="name">${c.name}</span><span class="kanji">${c.jp}</span></span><span class="visit">${dateStr}</span></div>
  <div class="nowrow"><span class="icon" aria-hidden="true">${wxIcon(weather)}</span><span class="temp">${fmt(temp)}</span><span class="desc"><b>Meteo attuale</b>${weatherDetail}</span>${w?.current?`<span class="now-extra"><span class="stat"><span class="stat-label">Percepita</span><span class="stat-value">${fmt(w.current.apparent_temperature)}</span></span><span class="stat"><span class="stat-label">Umidità</span><span class="stat-value">${w.current.relative_humidity_2m??'—'}%</span></span></span>`:''}</div>
  <div class="history"><div class="history-title">Storico 2025<small>medie nelle tue stesse date</small></div><div class="history-num">${hist.hi==null?'—':`<span class="high">↑ ${fmt(hist.hi)}</span> <span class="low">↓ ${fmt(hist.lo)}</span>`}</div></div>
  ${foliageHtml(c)}</article>`;
}
function render(){root.innerHTML=CITIES.map(cityHtml).join('');}
async function getJson(url,timeout=15000){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeout);try{const res=await fetch(url,{signal:ctrl.signal,cache:'no-store'});if(!res.ok)throw Error(`${res.status}`);return await res.json()}finally{clearTimeout(t)}}
function apiUrl(endpoint,params){const u=new URL(endpoint);for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));return u.toString()}
async function load(){
  const loc={latitude:CITIES.map(c=>c.lat).join(','),longitude:CITIES.map(c=>c.lon).join(','),timezone:'Asia/Tokyo'};
  if(demo){forecasts=CITIES.map((c,i)=>({current:{temperature_2m:12+i,apparent_temperature:10+i,relative_humidity_2m:58,weather_code:[2,3,0,61,3,1][i]}}));render();return;}
  const fUrl=apiUrl('https://api.open-meteo.com/v1/forecast',{...loc,current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code'});
  const hUrl=apiUrl('https://archive-api.open-meteo.com/v1/archive',{...loc,start_date:'2025-11-13',end_date:'2025-11-30',daily:'temperature_2m_max,temperature_2m_min'});
  const jobs=[
    getJson(fUrl).then(data=>{if(!Array.isArray(data)||data.length!==6)throw Error('Forecast locations');forecasts=data;render()}).catch(e=>console.warn('Meteo Open-Meteo:',e.message)),
    getJson(hUrl).then(data=>{if(!Array.isArray(data)||data.length!==6)throw Error('Archive locations');history=data;render()}).catch(e=>console.warn('Storico Open-Meteo:',e.message))
  ];
  await Promise.all(jobs);
}
render();load();
if(!demo)setInterval(()=>{if(!document.hidden)load()},30*60*1000);
</script>
</body>
</html>
